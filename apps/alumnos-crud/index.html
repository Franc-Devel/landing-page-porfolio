<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Administración Educativa & Roles · Francisco Delgado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <header class="header mb-4 text-center">
        <h1 class="display-5 fw-bold">Panel de Gestión de Alumnos</h1>
        <p class="text-muted">Administración de la comisión mediante API REST simulada.</p>
      </header>

      <section class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4">
          <h2 class="h4 mb-4" id="form-title">Agregar nuevo alumno</h2>
          <form id="alumno-form" novalidate>
            <input type="hidden" id="alumno-id" />

            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label fw-semibold">Nombre</label>
                <input type="text" id="nombre" class="form-control" placeholder="Ej: Agustín" required />
              </div>

              <div class="col-md-4">
                <label class="form-label fw-semibold">Apellido</label>
                <input type="text" id="apellido" class="form-control" placeholder="Ej: Delgado" required />
              </div>

              <div class="col-md-2">
                <label class="form-label fw-semibold">Edad</label>
                <input type="number" id="edad" class="form-control" min="1" max="120" />
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Email institucional</label>
                <input type="email" id="email" class="form-control" placeholder="nombre@ejemplo.com" required />
              </div>

              <div class="col-md-4">
                <label class="form-label fw-semibold">Comisión</label>
                <input type="text" id="comision" class="form-control" placeholder="Ej: 2do Año" maxlength="20" />
              </div>

              <div class="col-md-2 d-flex align-items-end">
                <div class="form-check mb-2">
                  <input class="form-check-input" type="checkbox" id="activo" checked>
                  <label class="form-check-label" for="activo">Activo</label>
                </div>
              </div>
            </div>

            <div class="d-flex gap-2 mt-4">
              <button type="submit" id="submit-btn" class="btn btn-primary px-4">Guardar Alumno</button>
              <button type="button" id="cancel-btn" class="btn btn-outline-secondary px-4" hidden>Cancelar Edición</button>
            </div>
          </form>
        </div>
      </section>

      <section class="card shadow-sm border-0">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h4 m-0">Listado de Alumnos Registrados</h2>
            <button type="button" id="reload-btn" class="btn btn-sm btn-light border">Actualizar Lista</button>
          </div>

          <div id="status-message" class="alert d-none" role="alert" aria-live="polite"></div>

          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th scope="col">ID</th>
                  <th scope="col">Nombre</th>
                  <th scope="col">Apellido</th>
                  <th scope="col">Edad</th>
                  <th scope="col">Email</th>
                  <th scope="col">Comisión</th>
                  <th scope="col">Estado</th>
                  <th scope="col" class="text-center">Acciones</th>
                </tr>
              </thead>
              <tbody id="alumnos-tbody">
                </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script src="./index.js"></script>
  </body>
</html>
