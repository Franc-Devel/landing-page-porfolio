<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora Pro | Francis Delgado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-primary: #0a0e17;
        --bg-card: rgba(18, 26, 43, 0.85);
        --accent: #38bdf8;
        --accent-gradient: linear-gradient(135deg, #38bdf8, #818cf8);
        --op-color: #f59e0b;
        --eq-color: #10b981;
        --danger: #ef4444;
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --border: rgba(255, 255, 255, 0.1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Outfit', sans-serif;
        background: radial-gradient(circle at 50% 20%, #152238 0%, #080c14 100%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .calculator-container {
        width: 100%;
        max-width: 440px;
        background: var(--bg-card);
        backdrop-filter: blur(20px);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 28px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 1.1rem;
        letter-spacing: -0.5px;
      }

      .brand-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
      }

      .mode-badge {
        font-size: 0.75rem;
        background: rgba(56, 189, 248, 0.15);
        color: var(--accent);
        padding: 4px 10px;
        border-radius: 20px;
        font-weight: 600;
        border: 1px solid rgba(56, 189, 248, 0.3);
      }

      .display-screen {
        background: rgba(10, 15, 25, 0.75);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 20px;
        text-align: right;
        margin-bottom: 24px;
        min-height: 110px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        overflow: hidden;
      }

      .expression {
        font-family: 'JetBrains Mono', monospace;
        font-size: 1rem;
        color: var(--text-muted);
        min-height: 24px;
        word-break: break-all;
        margin-bottom: 6px;
      }

      .main-value {
        font-family: 'JetBrains Mono', monospace;
        font-size: 2.4rem;
        font-weight: 700;
        color: #ffffff;
        word-break: break-all;
        line-height: 1.1;
      }

      .keypad {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }

      button {
        font-family: 'Outfit', sans-serif;
        font-size: 1.25rem;
        font-weight: 600;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 16px 0;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        cursor: pointer;
        transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateY(-2px);
      }

      button:active {
        transform: translateY(1px);
      }

      button.fn {
        color: var(--text-muted);
        background: rgba(255, 255, 255, 0.02);
      }

      button.op {
        color: var(--op-color);
        background: rgba(245, 158, 11, 0.08);
        border-color: rgba(245, 158, 11, 0.2);
      }

      button.op:hover {
        background: rgba(245, 158, 11, 0.2);
      }

      button.danger {
        color: var(--danger);
        background: rgba(239, 68, 68, 0.08);
        border-color: rgba(239, 68, 68, 0.2);
      }

      button.danger:hover {
        background: rgba(239, 68, 68, 0.2);
      }

      button.equal {
        background: var(--accent-gradient);
        color: #ffffff;
        border: none;
        box-shadow: 0 4px 18px rgba(56, 189, 248, 0.35);
      }

      button.equal:hover {
        opacity: 0.95;
        box-shadow: 0 6px 22px rgba(56, 189, 248, 0.5);
      }

      .history-section {
        margin-top: 20px;
        border-top: 1px solid var(--border);
        padding-top: 16px;
      }

      .history-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-bottom: 10px;
      }

      .history-list {
        max-height: 80px;
        overflow-y: auto;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.8rem;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .history-item {
        display: flex;
        justify-content: space-between;
        color: var(--text-muted);
        padding: 4px 8px;
        border-radius: 8px;
        cursor: pointer;
      }

      .history-item:hover {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
      }

      .history-clear {
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 0.75rem;
        padding: 2px 6px;
        cursor: pointer;
      }

      .footer-credit {
        margin-top: 24px;
        font-size: 0.85rem;
        color: var(--text-muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="calculator-container" role="region" aria-label="Calculadora Digital Pro">
      <div class="header">
        <div class="brand">
          <div class="brand-dot"></div>
          <span>Francis Calc</span>
        </div>
        <span class="mode-badge">JS Engine v2.0</span>
      </div>

      <div class="display-screen" aria-live="polite">
        <div class="expression" id="expressionView"></div>
        <div class="main-value" id="resultView">0</div>
      </div>

      <div class="keypad">
        <button class="danger" id="btnClear">C</button>
        <button class="fn" id="btnBack">⌫</button>
        <button class="fn" id="btnPercent">%</button>
        <button class="op" data-op="/">÷</button>

        <button data-num="7">7</button>
        <button data-num="8">8</button>
        <button data-num="9">9</button>
        <button class="op" data-op="*">×</button>

        <button data-num="4">4</button>
        <button data-num="5">5</button>
        <button data-num="6">6</button>
        <button class="op" data-op="-">−</button>

        <button data-num="1">1</button>
        <button data-num="2">2</button>
        <button data-num="3">3</button>
        <button class="op" data-op="+">+</button>

        <button class="fn" id="btnSign">±</button>
        <button data-num="0">0</button>
        <button data-num=".">.</button>
        <button class="equal" id="btnEquals">=</button>
      </div>

      <div class="history-section">
        <div class="history-header">
          <span>Historial Reciente</span>
          <button class="history-clear" id="btnClearHistory">Borrar</button>
        </div>
        <div class="history-list" id="historyList">
          <div style="color: #64748b; font-size: 0.75rem;">Sin operaciones recientes</div>
        </div>
      </div>
    </main>

    <footer class="footer-credit">
      Desarrollado con JavaScript Vanilla &middot; Francis Delgado
    </footer>

    <script src="./calculadora.js"></script>
  </body>
</html>
