<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="Author" content="Francisco Agustín Delgado" />
    <title>Ingresar - FrancisBank</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="bg-light">
    <main
      class="container d-flex justify-content-center align-items-center vh-100"
    >
      <div
        class="card shadow-lg border-0"
        style="max-width: 400px; width: 100%"
      >
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">FrancisBank</h2>
            <p class="text-muted">Ingresá a tu cuenta</p>
          </div>

          <form>
            <div class="mb-3">
              <label for="usuario" class="form-label small fw-bold"
                >Usuario o DNI</label
              >
              <input
                type="text"
                class="form-control"
                id="usuario"
                placeholder="Ej: 42123456"
              />
            </div>

            <div class="mb-4">
              <label for="password" class="form-label small fw-bold"
                >Contraseña</label
              >
              <div class="input-group">
                <input
                  type="password"
                  class="form-control"
                  id="inputPassword"
                  placeholder="Tu clave secreta"
                />
                <button
                  class="btn btn-outline-secondary"
                  type="button"
                  id="btnToggle"
                >
                  <i id="iconoOjo" class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary fw-bold">
                Entrar
              </button>
            </div>

            <div class="text-center mt-3">
              <a href="#" class="text-decoration-none small"
                >¿Olvidaste tu clave?</a
              >
            </div>
          </form>
        </div>
      </div>
    </main>

    <script>
      const btnToggle = document.querySelector("#btnToggle");
      const inputPass = document.querySelector("#inputPassword");
      const icono = document.querySelector("#iconoOjo");

      btnToggle.addEventListener("click", () => {
        // Cambiamos el tipo de input
        const type =
          inputPass.getAttribute("type") === "password" ? "text" : "password";
        inputPass.setAttribute("type", type);

        // Cambiamos el icono (ojo abierto / ojo tachado)
        icono.classList.toggle("bi-eye");
        icono.classList.toggle("bi-eye-slash");
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
