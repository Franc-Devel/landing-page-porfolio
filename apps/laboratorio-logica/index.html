<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Control | Condicionales y Bucles JS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <h2 class="mb-4 text-center">Laboratorio de Lógica JS</h2>

          <div class="bunker-card p-4">
            <div class="mb-3">
              <label class="form-label text-muted fw-bold"
                >1. Nivel de Operación:</label
              >
              <div
                class="nav nav-pills nav-fill gap-2 p-1 bg-dark rounded-3 border border-secondary"
                id="faseTabs"
              >
                <a class="nav-link active" data-fase="1">Fase 1: Básicos</a>
                <a class="nav-link" data-fase="2">Fase 2: Intermedios</a>
                <a class="nav-link" data-fase="3">Fase 3: Bucles</a>
              </div>
            </div>

            <div class="mb-4">
              <label for="ejercicioSelect" class="form-label text-muted fw-bold"
                >2. Módulo a Ejecutar:</label
              >
              <select
                class="form-select bg-dark text-light border-secondary"
                id="ejercicioSelect"
              ></select>
            </div>

            <div class="d-grid gap-2 mb-4">
              <button class="btn btn-ejecutar fw-bold" id="btnEjecutar">
                Ejecutar Código
              </button>
            </div>

            <label class="form-label text-muted">Salida de Consola:</label>
            <div id="terminal" class="terminal-output">
              > Sistema inicializado. Esperando órdenes...
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./assets/app.js"></script>
  </body>
</html>
