<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control Central | FAUVOR Taller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Al cargar o recargar, se limpia la sesión para solicitar siempre el rol de inicio en modo demo
      try {
        localStorage.removeItem("lubri_user");
      } catch (e) {
        console.warn("Storage warning:", e);
      }

      // Interceptor inteligente de API para demostración estática offline con la base de datos completa
      (function() {
        let dbCache = null;
        async function getDb() {
          if (!dbCache) {
            try {
              const res = await realFetch('./db_full.json');
              dbCache = await res.json();
            } catch (err) {
              console.error("Error loading db_full.json:", err);
              dbCache = { products: [], categories: [], sales: [], clients: [], turnos: [], fichas: [], auditLogs: [], sessions: [] };
            }
          }
          return dbCache;
        }

        const realFetch = window.fetch;
        window.fetch = async function(url, options = {}) {
          const urlStr = typeof url === "string" ? url : (url && url.url ? url.url : "");

          if (urlStr.includes("/api/")) {
            const db = await getDb();
            const method = (options.method || 'GET').toUpperCase();

            // 1. Auth routes
            if (urlStr.includes("/api/auth/login")) {
              let body = {};
              try { body = JSON.parse(options.body || '{}'); } catch {}
              const isAdm = body.usuario === 'admin';
              const userObj = isAdm ? {
                id: 1,
                usuario: "admin",
                nombre: "Administrador General",
                rol: "Admin",
                token: "token_admin_" + Date.now(),
                terminal: body.terminal || "Caja_1"
              } : {
                id: 2,
                usuario: "cajero1",
                nombre: "Carlos Gómez",
                rol: "Cajero",
                token: "token_cajero_" + Date.now(),
                terminal: body.terminal || "Caja_1"
              };
              return new Response(JSON.stringify({ success: true, user: userObj, message: "Acceso concedido" }), {
                headers: { "Content-Type": "application/json" }
              });
            }

            if (urlStr.includes("/api/auth/logout") || urlStr.includes("/api/auth/verify-session")) {
              return new Response(JSON.stringify({ valid: true, success: true }), {
                headers: { "Content-Type": "application/json" }
              });
            }

            // 2. Products / Catalog
            if (urlStr.includes("/api/products")) {
              let prods = db.products || [];
              const parsedUrl = new URL(urlStr, window.location.origin);
              const search = (parsedUrl.searchParams.get("search") || "").toLowerCase().trim();
              const catId = parsedUrl.searchParams.get("categoryId");

              if (search) {
                prods = prods.filter(p =>
                  (p.nombre && p.nombre.toLowerCase().includes(search)) ||
                  (p.codigo && p.codigo.toLowerCase().includes(search)) ||
                  (p.descripcion && p.descripcion.toLowerCase().includes(search))
                );
              }
              if (catId) {
                prods = prods.filter(p => String(p.categoria_id) === String(catId));
              }

              // Mapear campos para compatibilidad con vistas frontend (PosView y CatalogView)
              const mapped = prods.map(p => ({
                id: p.id,
                code: p.code || p.codigo || "",
                codigo: p.code || p.codigo || "",
                name: p.name || p.nombre || "",
                nombre: p.name || p.nombre || "",
                presentation: p.presentation || "",
                descripcion: p.presentation || p.descripcion || "",
                categoria: p.categoria_nombre || p.categoria || "General",
                categoria_nombre: p.categoria_nombre || p.categoria || "General",
                categoria_id: p.categoria_id,
                stock: p.stock !== undefined ? p.stock : (p.stock_actual || 0),
                stock_actual: p.stock !== undefined ? p.stock : (p.stock_actual || 0),
                stock_minimo: p.stock_minimo || 5,
                cost_price: p.cost_price || p.precio_costo || 0,
                precio_costo: p.cost_price || p.precio_costo || 0,
                price: p.price !== undefined ? p.price : (p.precio_venta || 0),
                precio_venta: p.price !== undefined ? p.price : (p.precio_venta || 0),
                precio: p.price !== undefined ? p.price : (p.precio_venta || 0),
                ubicacion: p.ubicacion || "Depósito A",
                sucursal: p.sucursal || "Sucursal A"
              }));
              return new Response(JSON.stringify(mapped), { headers: { "Content-Type": "application/json" } });
            }

            if (urlStr.includes("/api/categories")) {
              return new Response(JSON.stringify(db.categories || []), { headers: { "Content-Type": "application/json" } });
            }

            // 3. Sales & History
            if (urlStr.includes("/api/sales")) {
              if (method === 'POST') {
                return new Response(JSON.stringify({ success: true, id: Date.now(), ticket: "TKT-" + Math.floor(Math.random()*90000+10000) }), {
                  headers: { "Content-Type": "application/json" }
                });
              }
              return new Response(JSON.stringify(db.sales || []), { headers: { "Content-Type": "application/json" } });
            }

            // 4. Clients
            if (urlStr.includes("/api/clients")) {
              return new Response(JSON.stringify(db.clients || []), { headers: { "Content-Type": "application/json" } });
            }

            // 5. Turnos / Appointments
            if (urlStr.includes("/api/appointments")) {
              return new Response(JSON.stringify(db.turnos || []), { headers: { "Content-Type": "application/json" } });
            }

            // Vehicle routes must match the real API's response shapes.
            if (urlStr.includes("/api/vehicles")) {
              const route = new URL(urlStr, window.location.origin);
              const fichas = (db.fichas || []).filter(v => v && typeof v === 'object' && typeof v.marca === 'string' && typeof v.modelo === 'string' && v.modelo.trim());
              const type = route.searchParams.get('type');
              const brand = route.searchParams.get('brand');
              const model = route.searchParams.get('model');
              const filtered = fichas.filter(v => (!type || v.tipo === type) && (!brand || v.marca === brand));
              let result;
              if (route.pathname.endsWith('/types')) result = [...new Set(fichas.map(v => v.tipo))];
              else if (route.pathname.endsWith('/brands')) result = [...new Set(filtered.map(v => v.marca))].sort();
              else if (route.pathname.endsWith('/models')) result = [...new Set(filtered.map(v => v.modelo))].sort();
              else if (route.pathname.endsWith('/specs') && method === 'POST') {
                const body = JSON.parse(options.body || '{}');
                if (!String(body.marca || '').trim() || !String(body.modelo || '').trim()) return new Response(JSON.stringify({error:'Marca y modelo obligatorios'}), {status:400,headers:{'Content-Type':'application/json'}});
                result = {...body, id: Date.now()};
                db.fichas.push(result);
              } else if (route.pathname.endsWith('/specs')) result = filtered.find(v => v.modelo === model) || null;
              else result = fichas;
              return new Response(JSON.stringify(result), {headers:{'Content-Type':'application/json'}});
            }

            // 7. Cash Status
            if (urlStr.includes("/api/cash/status") || urlStr.includes("/api/cash/summary-by-box")) {
              return new Response(JSON.stringify({
                isOpen: true,
                cajaId: "Caja_1",
                apertura: "2026-10-11 08:30:00",
                responsable: "Carlos Gómez",
                fondoInicial: 50000,
                totalRecaudado: 642800,
                efectivoEsperado: 385000
              }), { headers: { "Content-Type": "application/json" } });
            }
            if (urlStr.includes("/api/cash/sessions")) {
              return new Response(JSON.stringify(db.sessions || []), { headers: { "Content-Type": "application/json" } });
            }

            // 8. Dashboard KPIs
            if (urlStr.includes("/api/dashboard/kpis")) {
              return new Response(JSON.stringify({
                ventas_hoy: 642800,
                cant_ventas_hoy: 14,
                stock_critico: 4,
                total_productos: (db.products || []).length || 519,
                grafico_semanal: {
                  fechas: ["05/10", "06/10", "07/10", "08/10", "09/10", "10/10", "11/10"],
                  totales: [512000, 480000, 620000, 715000, 590000, 840000, 642800]
                },
                top_productos: [
                  { name: "Aceite YPF Elaion F50 5W40", total_vendido: 10, recaudacion: 485000 },
                  { name: "Filtro de Aceite WEGA WO-120", total_vendido: 8, recaudacion: 52000 },
                  { name: "Filtro de Aire WEGA FAP-3214", total_vendido: 8, recaudacion: 56800 },
                  { name: "Aceite Castrol GTX 20W50", total_vendido: 7, recaudacion: 245000 },
                  { name: "Aceite Gulf Formula G 5W40", total_vendido: 7, recaudacion: 287000 }
                ]
              }), { headers: { "Content-Type": "application/json" } });
            }

            // 9. Admin routes
            if (urlStr.includes("/api/admin/audit-logs")) {
              return new Response(JSON.stringify(db.auditLogs || []), { headers: { "Content-Type": "application/json" } });
            }
            if (urlStr.includes("/api/admin/users")) {
              return new Response(JSON.stringify([
                { id: 1, usuario: "admin", nombre_completo: "Administrador General", rol: "Admin", activo: 1 },
                { id: 2, usuario: "cajero1", nombre_completo: "Carlos Gómez", rol: "Cajero", activo: 1 },
                { id: 3, usuario: "vendedor", nombre_completo: "Vendedor POS", rol: "Cajero", activo: 1 }
              ]), { headers: { "Content-Type": "application/json" } });
            }
            if (urlStr.includes("/api/admin/vendors")) {
              return new Response(JSON.stringify(db.vendedores || []), { headers: { "Content-Type": "application/json" } });
            }
            if (urlStr.includes("/api/admin/suppliers")) {
              return new Response(JSON.stringify(db.proveedores || []), { headers: { "Content-Type": "application/json" } });
            }

            // Default fallback
            return new Response(JSON.stringify([]), { headers: { "Content-Type": "application/json" } });
          }

          return realFetch.apply(this, arguments);
        };
      })();
    </script>
