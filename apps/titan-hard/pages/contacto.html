<!doctype html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Titan Hard">
    <meta name="author" content="Francisco Agustín Delgado">
    <title>Titan Hard - Contactenos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/contacto.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../assets/img/favicon.ico.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>
<body>
    <header></header>
    <main>
        <section class="contactenos">
    <a href="../index.html" class="link_volver">Volver a la pagina principal ⮞</a>
            <article>
                <p class="texto_contactos">Escribenos tu consulta 👾​</p>
                <form action="">
            <div class="input">        
            <label for="nombre_apellido">Nombre y Apellido</label>   
            <input
            type="text"
            id="nombre_apellido"
            name="nombre_apellido"
            placeholder="Escribe tu Nombre y Apellido"
            required
            minlength="3"
            maxlength="40"
            />
            <label for="email">Email</label>
            <input
            type="email"
            id="email"
            name="email"
            placeholder="Email@gmail.com"
            required
            minlength="5"
            maxlength="40"
            />
            <label for="telefono">Telefono</label>
            <input type="tel" 
            name="telefono" 
            placeholder="381 8238296" 
            maxlength="15"
            oninput="this.value = this.value.replace(/\D/g, '')">
            <label for="consulta">Consulta</label>
            <textarea 
            name="Consulta" 
            id="consulta" 
            rows="5"
            required minlength="10" 
            maxlength="200" 
            placeholder="Escriba su consulta">
            </textarea>
            <button type="submit" class="boton_enviar">ENVIAR</button>
            </div>
            </form>
            <div class="mapa">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3560.105916739557!2d-65.207167!3d-26.836583299999994!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94225d3ad7f30f1d%3A0xf8606cd659b8e3e4!2sSan%20Miguel%20de%20Tucuman!5e0!3m2!1ses!2sar!4v1779829548890!5m2!1ses!2sar" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            </article>
        </section>
    </main>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
