    <main>
      <section class="loginSection registerSection">
        <div class="loginCard registerCard">
          <div class="loginHeader">
            <h2>CREAR CUENTA</h2>
            <p>Únete a la comunidad de Titan Hard</p>
          </div>
          <div class="lineaDivisora"></div>
          <form class="loginForm">
            <div class="registroGrid">
              <div class="inputForm">
                <label for="nombre">NOMBRE</label>
                <div class="inputBox">
                  <i class="fa-regular fa-user"></i>
                  <input
                    type="text"
                    id="nombre"
                    placeholder="Nombre"
                    required
                    minlength="2"
                    maxlength="30"
                    pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ\s]+"
                    title="Solo letras"
                    autocomplete="given-name"
                  />
                </div>
              </div>
              <div class="inputForm">
                <label for="apellido">APELLIDO</label>
                <div class="inputBox">
                  <i class="fa-regular fa-user"></i>
                  <input
                    type="text"
                    id="apellido"
                    placeholder="Apellido"
                    required
                    minlength="2"
                    maxlength="30"
                    pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ\s]+"
                    title="Solo letras"
                    autocomplete="family-name"
                  />
                </div>
              </div>
              <div class="inputForm">
                <label for="username">USERNAME</label>
                <div class="inputBox">
                  <i class="fa-solid fa-at"></i>
                  <input
                    type="text"
                    id="username"
                    placeholder="TitanUser"
                    required
                    minlength="4"
                    maxlength="20"
                    pattern="[A-Za-z0-9_]+"
                    title="Solo letras, números y guion bajo"
                    autocomplete="username"
                  />
                </div>
              </div>
              <div class="inputForm">
                <label for="email">EMAIL</label>
                <div class="inputBox">
                  <i class="fa-regular fa-envelope"></i>
                  <input
                    type="email"
                    id="email"
                    placeholder="ejemplo@gmail.com"
                    required
                    maxlength="50"
                    autocomplete="email"
                  />
                </div>
              </div>
              <div class="inputForm">
                <label for="telefono">TELÉFONO</label>
                <div class="inputBox">
                  <i class="fa-solid fa-phone"></i>
                  <input
                    type="tel"
                    id="telefono"
                    placeholder="+54 381 000000"
                    required
                    pattern="[0-9+\s]+"
                    minlength="8"
                    maxlength="18"
                    title="Solo números"
                    autocomplete="tel"
                    type="number"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                  />
                </div>
              </div>
              <div class="inputForm">
                <label for="cp">CÓDIGO POSTAL</label>
                <div class="inputBox">
                  <i class="fa-solid fa-location-dot"></i>
                  <input
                    type="text"
                    id="cp"
                    placeholder="4000"
                    required
                    pattern="[0-9]{4,8}"
                    title="Solo números"
                    maxlength="8"
                    autocomplete="postal-code"
                    type="number"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                  />
                </div>
              </div>
            </div>
            <div class="inputForm">
              <label for="direccion">DOMICILIO</label>
              <div class="inputBox">
                <i class="fa-solid fa-house"></i>
                <input
                  type="text"
                  id="direccion"
                  placeholder="Domicilio"
                  required
                  minlength="5"
                  maxlength="80"
                  autocomplete="street-address"
                />
              </div>
            </div>
            <div class="registroGrid">
              <div class="inputForm">
                <label for="password">CONTRASEÑA</label>
                <div class="inputBox">
                  <i class="fa-solid fa-lock"></i>
                  <input
                    type="password"
                    id="password"
                    placeholder="********"
                    required
                    minlength="8"
                    maxlength="24"
                    pattern="^(?=.*[A-Z])(?=.*[a-z])(?=.*\d).+$"
                    title="Debe contener mayúscula, minúscula y número"
                    autocomplete="new-password"
                  />
                </div>
              </div>
              <div class="inputForm">
                <label for="confirmPassword">CONFIRMAR CONTRASEÑA</label>
                <div class="inputBox">
                  <i class="fa-solid fa-lock"></i>
                  <input
                    type="password"
                    id="confirmPassword"
                    placeholder="********"
                    required
                    minlength="8"
                    maxlength="24"
                    autocomplete="new-password"
                  />
                </div>
              </div>
            </div>
            <div class="loginOpciones">
              <label class="recuerdame">
                <input type="checkbox" required />
                <span>Acepto los términos y condiciones</span>
              </label>
            </div>
            <button type="submit" class="loginButton">
              CREAR CUENTA <i class="fa-solid fa-arrow-right"></i>
            </button>
          </form>
          <p class="registroTexto">
            ¿Ya tienes una cuenta?<a href="../pages/login.html"

            >
